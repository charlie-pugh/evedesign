[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evedesign"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = []
authors = [
  { name = "Thomas Hopf", email = "thomas.hopf@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "numpy", "pandas", "loguru", "biotite", "biopython", "dnachisel", "scikit-learn", "numba", "scipy", "requests"
]

[project.optional-dependencies]
evmutation2 = ["torch", "evmutation2"]
evcouplings = ["evcouplings"]
esm2 = ["torch", "transformers"]
mpnn = ["torch", "prody"]
# boltz2fold: CPU/MPS install (default).
# boltz2fold-cuda: adds boltz's [cuda] extra, which pulls
# cuequivariance_ops_cu12, cuequivariance_ops_torch_cu12, and
# cuequivariance_torch (all >=0.5.0). The cu12 ops wheels are built
# for CUDA 12 and require a CUDA 12 toolkit/driver plus a
# CUDA-enabled torch build (verified on CUDA 12.8); not usable on
# CPU-only or macOS.
boltz2fold = ["torch", "boltz>=2.2", "pyyaml"]
boltz2fold-cuda = ["torch", "boltz[cuda]>=2.2", "pyyaml"]
umap = ["umap-learn"]
notebooks = ["py3Dmol"]

[dependency-groups]
dev = [
    "pytest",
]

[project.urls]
Documentation = "https://github.com/evedesignbio/evedesign#readme"
Issues = "https://github.com/evedesignbio/evedesign/issues"
Source = "https://github.com/evedesignbio/evedesign"

[tool.hatch.version]
path = "src/evedesign/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/evedesign tests}"

[tool.coverage.run]
source_pkgs = ["evedesign", "tests"]
branch = true
parallel = true
omit = [
  "src/evedesign/__about__.py",
]

[tool.coverage.paths]
evedesign = ["src/evedesign", "*/evedesign/src/evedesign"]
tests = ["tests", "*/evedesign/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.uv]
required-version = ">=0.11.15"
override-dependencies = [
    { package = { name = "boltz" }, dependencies = ["numpy>=2.0", "scipy>=1.14", "numba>=0.64"] },]