[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evedesign"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = []
authors = [
  { name = "Thomas Hopf", email = "thomas.hopf@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "numpy", "pandas", "loguru", "biotite", "biopython", "dnachisel", "scikit-learn", "numba", "scipy", "requests"
]

[project.optional-dependencies]
evmutation2 = ["torch", "evmutation2"]
esm2 = ["torch", "transformers"]
mpnn = ["torch", "prody"]
# boltz2fold: CPU/MPS install (default)
# boltz2fold-cuda: adds CUDA-12 extras (cuequivariance_*)
# — only works on CUDA-12 systems with compatible torch build
boltz2fold = ["torch", "boltz>=2.2,<2.3", "pyyaml"]
boltz2fold-cuda = ["torch", "boltz[cuda]>=2.2,<2.3", "pyyaml"]
umap = ["umap-learn"]
notebooks = ["py3Dmol"]

[dependency-groups]
dev = [
    "pytest",
]

[project.urls]
Documentation = "https://github.com/evedesignbio/evedesign#readme"
Issues = "https://github.com/evedesignbio/evedesign/issues"
Source = "https://github.com/evedesignbio/evedesign"

[tool.hatch.version]
path = "src/evedesign/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/evedesign tests}"

[tool.coverage.run]
source_pkgs = ["evedesign", "tests"]
branch = true
parallel = true
omit = [
  "src/evedesign/__about__.py",
]

[tool.coverage.paths]
evedesign = ["src/evedesign", "*/evedesign/src/evedesign"]
tests = ["tests", "*/evedesign/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.uv]
# Override stale/blocking upstream pins so a fresh install
# lands on a working, modern stack:
#   - boltz 2.2.1 declares numpy<2.0 and scipy==1.13.1;
#     both are stale — boltz runs fine on numpy 2.x and
#     scipy>=1.14 (empirically verified).
#   - boltz pins numba==0.61.0, which runtime-rejects
#     numpy>2.1. We override numba up to >=0.64 (supports
#     numpy<2.5) so numpy can stay modern. numpy is capped
#     at <2.5 to satisfy numba 0.64+'s runtime check —
#     without this cap, uv resolves numpy 2.5 and numba
#     raises ImportError at import.
# Revisit these bounds when bumping boltz: a future boltz
# may relax its numba pin, allowing a higher numpy ceiling.
override-dependencies = [
    "numpy>=2.0,<2.5",
    "numba>=0.64",
    "scipy>=1.14",
]
